<!doctype html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — ZAGROOO Wizard</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link href="theme.css" rel="stylesheet" />
    <link href="login.css" rel="stylesheet" />
    <script>
        (function () {
            var KEY = 'zag-theme';
            var root = document.documentElement;
            try {
                root.classList.toggle('dark', localStorage.getItem(KEY) !== 'light');
            } catch (e) {
                root.classList.add('dark');
            }
            document.addEventListener('click', function (event) {
                var button = event.target.closest && event.target.closest('#theme-toggle');
                if (!button) return;
                var isDark = root.classList.toggle('dark');
                try { localStorage.setItem(KEY, isDark ? 'dark' : 'light'); } catch (err) { /* storage blocked */ }
            });
        })();
    </script>
</head>

<body>
    <button id="theme-toggle" class="zag-theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">
        <svg class="icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <svg class="icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
    </button>

    <main class="auth-wrap">
        <div class="card auth-card">
            <div class="brand-row">
                <span class="brand-mark">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M13 2 4.5 13.5H10L9 22l8.5-11.5H12L13 2z" />
                    </svg>
                </span>
                <span class="brand-name">ZAGROOO Wizard</span>
            </div>

            <div class="tabs" role="tablist">
                <button class="tab is-active" data-tab="login" type="button">Sign in</button>
                <button class="tab" data-tab="register" type="button">Create account</button>
            </div>

            <form id="login-form" class="form" novalidate>
                <div class="field">
                    <label for="login-email">Email</label>
                    <input id="login-email" type="email" autocomplete="email" required />
                </div>
                <div class="field">
                    <label for="login-password">Password</label>
                    <input id="login-password" type="password" autocomplete="current-password" required />
                </div>
                <button class="btn-primary" type="submit">Sign in</button>
            </form>

            <form id="register-form" class="form" hidden novalidate>
                <div class="field">
                    <label for="reg-email">Email</label>
                    <input id="reg-email" type="email" autocomplete="email" required />
                </div>
                <div class="field">
                    <label for="reg-password">Password <span class="hint">at least 8 characters</span></label>
                    <input id="reg-password" type="password" autocomplete="new-password" minlength="8" required />
                </div>
                <div class="field">
                    <label for="reg-invite">Invite code</label>
                    <input id="reg-invite" type="password" autocomplete="off" required />
                </div>
                <button class="btn-primary" type="submit">Create account</button>
            </form>

            <p class="error" id="error" hidden></p>
        </div>
    </main>

    <script src="login.js"></script>
</body>

</html>
