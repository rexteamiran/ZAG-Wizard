# Deploys the wizard worker from GitHub's runners.
#
# One-time setup - add repository secrets under
# Settings -> Secrets and variables -> Actions -> New repository secret:
#
#   CLOUDFLARE_API_TOKEN   required — Workers Scripts Edit, D1 Edit and
#                          Account Settings Read on the wizard's account
#   WIZARD_SECRET          required — any long random string; encrypts stored
#                          panel API keys and signs sessions server-side
#   WIZARD_INVITE_CODE     optional — the code new accounts must present at
#                          sign-up. Leave unset to keep registration closed.
#
# The deploy provisions the wizard's D1 database first, then runs wrangler.

name: Deploy Wizard

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run check

      - name: Build the secrets list
        # An empty secret must not appear in the wrangler secrets list, or the
        # upload itself fails. The invite code is genuinely optional: unset
        # means registration stays closed. The other two are required, and a
        # missing one should fail here with a readable message rather than
        # deep inside wrangler's secret upload.
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$WIZARD_SECRET" ]; then
            echo "::error::The WIZARD_SECRET secret is not set. Add any long random string under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          list="SECRET"
          if [ -n "$WIZARD_INVITE_CODE" ]; then
            list="$list"$'\n'"WIZARD_INVITE_CODE"
          fi
          echo "SECRETS_LIST<<EOF" >> $GITHUB_ENV
          echo "$list" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        env:
          WIZARD_INVITE_CODE: ${{ secrets.WIZARD_INVITE_CODE }}
          WIZARD_SECRET: ${{ secrets.WIZARD_SECRET }}

      - name: Provision the wizard database
        run: node scripts/provision.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          secrets: ${{ env.SECRETS_LIST }}
        env:
          SECRET: ${{ secrets.WIZARD_SECRET }}
          WIZARD_INVITE_CODE: ${{ secrets.WIZARD_INVITE_CODE }}
