# Deploys the wizard worker from GitHub's runners.
#
# One-time setup - add three repository secrets under
# Settings -> Secrets and variables -> Actions -> New repository secret:
#
#   CLOUDFLARE_API_TOKEN   a token with Workers Scripts Edit, D1 Edit and
#                          Account Settings Read on the wizard's account
#   WIZARD_SECRET          any long random string; encrypts stored panel API
#                          keys and signs sessions server-side
#   WIZARD_INVITE_CODE     the code new accounts must present at sign-up;
#                          leave unset to keep registration closed
#
# The deploy provisions the wizard's D1 database first, then runs wrangler.

name: Deploy Wizard

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run check

      - name: Provision the wizard database
        run: node scripts/provision.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          secrets: |
            SECRET
            WIZARD_INVITE_CODE
        env:
          SECRET: ${{ secrets.WIZARD_SECRET }}
          WIZARD_INVITE_CODE: ${{ secrets.WIZARD_INVITE_CODE }}
