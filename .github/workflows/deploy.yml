# Deploys the wizard worker from GitHub's runners.
#
# Useful when `npm run deploy` on your own machine cannot reach
# api.cloudflare.com. GitHub's network can, so the deploy always goes through.
#
# One-time setup - add two repository secrets under
# Settings -> Secrets and variables -> Actions -> New repository secret:
#
#   CLOUDFLARE_API_TOKEN   the same Cloudflare token the wizard uses
#   WIZARD_SECRET          any long random string; it encrypts the private
#                          install links the wizard hands out
#
# Then run this workflow from the Actions tab.

name: Deploy Wizard

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run check

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          secrets: |
            SECRET
        env:
          SECRET: ${{ secrets.WIZARD_SECRET }}
